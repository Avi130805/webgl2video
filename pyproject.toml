[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webgl2video"
version = "0.1.0"
description = "Render any WebGL or HTML animation (Three.js, shaders, p5.js, AI-generated pages) to frame-exact 4K60 video on a GPU, locally or on cheap cloud GPUs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["playwright>=1.45", "numpy>=1.24"]
license = { text = "MIT" }

[project.scripts]
webgl2video = "webgl2video.__main__:main"

[tool.setuptools]
packages = ["webgl2video"]
