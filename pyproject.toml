[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webgl-render-farm"
version = "0.1.0"
description = "Render deterministic WebGL pages into frame-exact video (up to 4K60, SDR or HDR10) on a local or cloud GPU"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["playwright>=1.45", "numpy>=1.24"]
# license: to be chosen (see LICENSE)

[project.scripts]
renderfarm = "renderfarm.__main__:main"

[tool.setuptools]
packages = ["renderfarm"]
