<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hello: a deterministic WebGL2 page</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: #8a8f98; font: 12px/1.4 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
// A tiny page that follows the frame contract (docs/page-contract.md): every frame is a pure function of its index.
// Two shots and a hard cut at 2 s (the QA step finds it), HDR highlights (a 1,000-nit sun, stars, a comet), and a
// soundtrack rendered offline with a tick on every second. Opened plainly, it plays as a preview; opened by the driver
// (?render=1&w=..&h=..&format=..), it renders frames on request.
import { renderParams, exposeRenderer, encodeWav } from '../../page/render-page.js';

const P = renderParams();
const FPS = 60;
const SECONDS = Math.max(1, Math.min(600, Number(P.get('seconds', 10)) || 10));
const FRAMES = Math.round(FPS * SECONDS);
const CUT = 2 * FPS; // the second shot starts at frame 120

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) throw new Error('WebGL2 is not available');

const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// The scene is lit in nits (linear BT.709), then written as SDR display codes or as HDR PQ code values of BT.2020.
const FS = `#version 300 es
precision highp float;
precision highp int;
uniform vec2 uRes;
uniform float uT;   // seconds: frame / fps
uniform int uShot;  // 0: sunrise, 1: aurora
uniform int uHdr;   // 0: SDR (sRGB display codes), 1: HDR (PQ, BT.2020)
out vec4 o;

uint pcg(uint v) {
  uint s = v * 747796405u + 2891336453u;
  uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
float h01(uint v) { return float(pcg(v) & 0xffffffu) / 16777215.0; }

vec3 sunrise(vec2 p, float t, float px) {
  vec2 sun = vec2(0.12, -0.30 + 0.09 * t);
  float horizon = -0.22;
  float d = length(p - sun);
  float up = smoothstep(horizon, 0.5, p.y);
  vec3 c = mix(vec3(55.0, 26.0, 14.0), vec3(1.6, 3.0, 9.0), pow(up, 0.6));
  c += vec3(90.0, 45.0, 16.0) * exp(-d * 9.0) + vec3(14.0, 8.0, 4.0) * exp(-d * 2.5);
  float r = 0.045;
  float limb = sqrt(max(0.0, 1.0 - d * d / (r * r)));
  c = mix(c, vec3(1000.0, 905.0, 760.0) * (0.55 + 0.45 * limb), smoothstep(r + px, r - px, d));
  float a = atan(p.y - sun.y, p.x - sun.x);
  for (int k = 1; k <= 7; k++) {
    float fk = float(k);
    float rk = 0.06 + 0.055 * fk + 0.006 * sin(t * 1.1 + fk);
    float w = 0.6 * px + 0.0004 * fk;
    float ring = smoothstep(w + px, w - px, abs(d - rk));
    float arc = 0.5 + 0.5 * sin(a * fk + t * (0.6 + 0.15 * fk) * (mod(fk, 2.0) * 2.0 - 1.0));
    c += vec3(24.0, 40.0, 70.0) * ring * arc * arc;
  }
  // the sea: dark water, the sun's path on it in broken ripples
  float sea = smoothstep(horizon + px, horizon - px, p.y);
  float depth = horizon - p.y;
  float ripple = 0.5 + 0.5 * sin(p.y * 240.0 / (depth + 0.05) + sin(p.x * 30.0 + t * 1.5) * 2.0);
  float u = (p.x - sun.x) / (0.02 + depth * 0.35);
  float path = exp(-u * u) * ripple * exp(-depth * 3.0);
  vec3 water = vec3(1.4, 1.3, 1.6) + vec3(220.0, 140.0, 70.0) * path;
  return mix(c, water, sea);
}

vec3 aurora(vec2 p, float t, float px) {
  vec3 c = mix(vec3(0.45, 0.55, 1.5), vec3(0.04, 0.05, 0.18), smoothstep(-0.3, 0.5, p.y));
  // stars: one per cell at most, placed and sized by a hash, twinkling
  const float N = 70.0;
  vec2 g = p * N;
  vec2 cell = floor(g);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 q = cell + vec2(i, j);
    uint h = uint(int(q.x) + 4096) * 73856093u ^ uint(int(q.y) + 4096) * 19349663u;
    if (h01(h) > 0.11) continue;
    vec2 at = q + vec2(h01(h + 1u), h01(h + 2u));
    float b = pow(h01(h + 3u), 8.0) * 300.0 + 1.0;
    b *= 0.75 + 0.25 * sin(t * (2.0 + 6.0 * h01(h + 4u)) + 6.283 * h01(h + 5u));
    float dpx = length(g - at) / N / px;
    c += vec3(0.85, 0.9, 1.0) * b * exp(-dpx * dpx * 0.9);
  }
  // three curtains: a sharp lower edge, rays above it
  for (int k = 0; k < 3; k++) {
    float fk = float(k);
    float x = p.x * (1.3 + 0.35 * fk) + t * (0.10 + 0.04 * fk);
    float base = -0.02 + 0.06 * fk + 0.09 * sin(x * 2.7 + fk * 1.7) + 0.035 * sin(x * 6.3 - t * 0.8);
    float dy = p.y - base;
    float edge = smoothstep(-0.004 - px, 0.006, dy);
    float rays = 0.55 + 0.45 * sin(x * 37.0 + 3.0 * sin(x * 4.0 + t)) * sin(x * 13.0 - t * 0.7);
    float curtain = edge * exp(-max(dy, 0.0) * (5.0 + 2.0 * fk)) * rays;
    vec3 col = k == 1 ? vec3(38.0, 9.0, 46.0) : vec3(8.0, 66.0, 26.0);
    c += col * curtain * (1.0 - 0.25 * fk);
  }
  // a comet crossing the sky
  float s = (t - 2.0) / 8.0;
  vec2 head = vec2(-0.95 + 1.9 * s, 0.30 - 0.12 * s);
  vec2 dir = normalize(vec2(1.9, -0.12));
  vec2 rel = p - head;
  float along = dot(rel, -dir), across = dot(rel, vec2(-dir.y, dir.x));
  float hd = length(rel) / px;
  c += vec3(820.0, 870.0, 1000.0) * exp(-hd * hd * 0.18);
  float spread = across / (0.002 + max(along, 0.0) * 0.06);
  if (along > 0.0) c += vec3(30.0, 42.0, 60.0) * exp(-along * 7.0) * exp(-spread * spread);
  // the mountains, black against the sky
  float ridge = -0.30 + 0.05 * (0.6 * sin(p.x * 5.1) + 0.3 * sin(p.x * 12.7 + 1.3) + 0.1 * sin(p.x * 31.0));
  return mix(c, vec3(0.02, 0.02, 0.03), smoothstep(ridge + px, ridge - px, p.y));
}

vec3 sdrCodes(vec3 nits) {
  vec3 x = nits / 80.0;
  x = x * (1.0 + x / 64.0) / (1.0 + x); // extended Reinhard, white at 640 nits
  x = clamp(x, 0.0, 1.0);
  return mix(12.92 * x, 1.055 * pow(x, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, x));
}
vec3 pqCodes(vec3 nits709) {
  const mat3 TO_2020 = mat3(0.6274, 0.0691, 0.0164, 0.3293, 0.9195, 0.0880, 0.0433, 0.0114, 0.8956);
  vec3 y = clamp(TO_2020 * nits709 / 10000.0, 0.0, 1.0);
  vec3 p = pow(y, vec3(0.1593017578125));
  return pow((0.8359375 + 18.8515625 * p) / (1.0 + 18.6875 * p), vec3(78.84375));
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float px = 1.0 / uRes.y;
  vec3 nits = uShot == 0 ? sunrise(p, uT, px) : aurora(p, uT, px);
  o = vec4(uHdr == 1 ? pqCodes(nits) : sdrCodes(nits), 1.0);
}`;

function program(vs, fs) {
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

const prog = program(VS, FS);
const vao = gl.createVertexArray();
const U = Object.fromEntries(['uRes', 'uT', 'uShot', 'uHdr'].map((k) => [k, gl.getUniformLocation(prog, k)]));

// Frame i, a pure function of i: into the render target (driver) or the canvas (preview).
function draw(i, target) {
  const w = target ? target.width : canvas.width, h = target ? target.height : canvas.height;
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog);
  gl.bindVertexArray(vao);
  gl.uniform2f(U.uRes, w, h);
  gl.uniform1f(U.uT, i / FPS);
  gl.uniform1i(U.uShot, i < CUT ? 0 : 1);
  gl.uniform1i(U.uHdr, target && target.hdr ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// The soundtrack, rendered offline: a chord per shot (it changes at the cut) and a tick on every second.
async function soundtrack(rate) {
  const ctx = new OfflineAudioContext(2, Math.round(rate * SECONDS), rate);
  const cutAt = CUT / FPS;
  const chord = (freqs, t0, t1, level) => freqs.forEach((f, k) => {
    const o = new OscillatorNode(ctx, { frequency: f });
    const g = new GainNode(ctx, { gain: 0 });
    const pan = new StereoPannerNode(ctx, { pan: (k - 1) * 0.5 });
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(level, Math.min(t1, t0 + 0.6));
    g.gain.setValueAtTime(level, Math.max(t0, t1 - 0.01));
    g.gain.linearRampToValueAtTime(0, t1);
    o.connect(g).connect(pan).connect(ctx.destination);
    o.start(t0);
    o.stop(t1);
  });
  chord([220.0, 277.18, 329.63], 0, cutAt, 0.06);
  chord([196.0, 233.08, 293.66, 587.33], cutAt, SECONDS, 0.05);
  for (let s = 0; s < SECONDS; s++) {
    const o = new OscillatorNode(ctx, { frequency: 1760 });
    const g = new GainNode(ctx, { gain: 0 });
    g.gain.setValueAtTime(0.25, s);
    g.gain.exponentialRampToValueAtTime(0.001, s + 0.04);
    o.connect(g).connect(ctx.destination);
    o.start(s);
    o.stop(s + 0.05);
  }
  return encodeWav(await ctx.startRendering());
}

if (P.render) {
  document.getElementById('hud').remove();
  exposeRenderer({ gl, fps: FPS, frameCount: FRAMES, draw, audio: soundtrack, info: { title: 'hello', cut: CUT } });
} else {
  // a preview, not frame-exact: the frame the clock says, at the window's size
  const hud = document.getElementById('hud');
  const t0 = performance.now();
  const loop = (now) => {
    const dpr = Math.min(2, devicePixelRatio || 1);
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const i = Math.floor(((now - t0) / 1000) * FPS) % FRAMES;
    draw(i, null);
    hud.textContent = `frame ${i} of ${FRAMES} · preview (open with ?render=1 to render frames for the driver)`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
